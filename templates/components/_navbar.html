<header class="app-topbar">
    <div class="d-flex align-items-center gap-3">
        <!-- Mobile Sidebar Toggle Button -->
        <button id="sidebar-toggle-btn" class="btn btn-sm btn-outline-secondary d-lg-none" type="button" aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>

        <h1 class="h5 mb-0 fw-bold d-none d-sm-block">
            {% block page_title %}Dashboard{% endblock %}
        </h1>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- Quick Action "+ New" Dropdown -->
        <div class="dropdown">
            <button class="btn btn-sm btn-primary-custom dropdown-toggle d-flex align-items-center gap-1 shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-plus-lg"></i>
                <span class="d-none d-md-inline">Create</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li>
                    <a class="dropdown-item py-2" href="{% url 'tasks:create' %}">
                        <i class="bi bi-check2-square text-primary me-2"></i> New Task
                    </a>
                </li>
                <li>
                    <a class="dropdown-item py-2" href="{% url 'habits:create' %}">
                        <i class="bi bi-repeat text-success me-2"></i> New Habit
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item py-2" href="{% url 'tasks:categories' %}">
                        <i class="bi bi-tag text-secondary me-2"></i> New Category
                    </a>
                </li>
            </ul>
        </div>

        <!-- Light / Dark Mode Toggle Button -->
        <button id="theme-toggle-btn" class="btn btn-sm btn-outline-secondary d-flex align-items-center justify-content-center p-2 rounded-circle" style="width: 36px; height: 36px;" type="button" title="Toggle Light/Dark Theme">
            <i id="theme-icon" class="bi bi-moon-stars-fill"></i>
        </button>

        <!-- User Dropdown Menu -->
        <div class="dropdown">
            <button class="btn p-0 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="avatar-badge">
                    {{ user_profile.initials|default:request.user.username|slice:":2"|upper }}
                </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li class="px-3 py-2 border-bottom">
                    <span class="d-block fw-semibold">{{ request.user.username }}</span>
                    <span class="d-block small text-muted">{{ request.user.email|default:"No email provided" }}</span>
                </li>
                <li><a class="dropdown-item py-2 mt-1" href="{% url 'accounts:profile' %}"><i class="bi bi-person me-2"></i> Profile & Theme</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'accounts:password_change' %}"><i class="bi bi-key me-2"></i> Change Password</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item py-2 text-danger" href="{% url 'accounts:logout' %}"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</a></li>
            </ul>
        </div>
    </div>
</header>
